<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle</title>
  <link rel="stylesheet" href="css/2416501003.css">
</head>
<body>
  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <main>
    <form>
      <label for="ad">Etkinlik adı</label>
      <input type="text" id="ad" value="Kariyer Günleri 2026">

      <label for="kat">Kategori</label>
      <select id="kat">
        <option value="">Seçiniz</option>
        <option value="seminer" selected>Seminer</option>
        <option value="atolye">Atölye</option>
      </select>

      <label for="tarih">Tarih</label>
      <input type="text" id="tarih" value="12.10.2026">

      <label for="aciklama">Açıklama</label>
      <textarea id="aciklama" rows="3">Mezun söyleşileri</textarea>

      <button type="submit" class="btn">Güncelle</button>
    </form>
  </main>
</body>
</html>
