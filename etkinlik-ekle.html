<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle - Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2416501003.css">
</head>
<body>

  <!-- Üst Menü / Header -->
  <header>
    <h1>Kampüs Etkinlikleri</h1>
    <nav>
      <a href="index.html">Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html" class="aktif">Ekle</a>
      <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>
  </header>

  <!-- Ana İçerik -->
  <main>
    <h2>Etkinlik Ekle</h2>

    <form class="etkinlik-form">
  <div class="form-grup">
    <label for="ad">Etkinlik adı</label>
    <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026">
  </div>

  <div class="form-grup">
    <label for="kategori">Kategori</label>
    <select id="kategori" name="kategori">
      <option value="seminer" selected>Seminer</option>
      <option value="atolye">Atölye</option>
      <option value="soylesi">Söyleşi</option>
    </select>
  </div>

  <div class="form-grup">
    <label for="tarih">Tarih</label>
    <input type="date" id="tarih" name="tarih" value="2026-10-12">
  </div>

  <div class="form-grup">
    <label for="aciklama">Açıklama</label>
    <textarea id="aciklama" name="aciklama">Mezun söyleşileri</textarea>
  </div>

  <button type="submit" class="btn">Kaydet</button>
</form>

    <br>
    <a href="etkinlikler.html">← Listeye dön</a>
  </main>

  <!-- Alt Bilgi / Footer -->
  <footer>
    <p>&copy; 2026 Kampüs Etkinlikleri - 2416501003</p>
  </footer>

</body>
</html>
